server {
    listen 80;
    server_name feizhu.openlx.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/openlx-fliggy-hotel-ops/public;
        default_type text/plain;
    }
    location / { return 301 https://feizhu.openlx.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name feizhu.openlx.cn;
    ssl_certificate /www/server/panel/vhost/cert/feizhu.openlx.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/feizhu.openlx.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FLIGGYSSL:1m;
    client_max_body_size 1m;
    access_log /www/wwwlogs/feizhu.openlx.cn.log;
    error_log /www/wwwlogs/feizhu.openlx.cn.error.log;
    location / {
        proxy_pass http://127.0.0.1:1989;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
