<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc"><title id="title">OpenLX 飞猪酒店运营工作流程</title><desc id="desc">安装、核对身份、读取数据、体检提案、授权执行回读、持续复盘六个步骤。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#ffe033" stroke-width="1.5"/></marker></defs><path d="M70 95H1120" fill="none" stroke="#a29aba" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arrow)"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#20222a"><g transform="translate(15,0)"><circle cx="85" cy="95" r="29" fill="#ffe033"/><text x="85" y="102" text-anchor="middle" fill="#20222a" font-size="19">01</text><text x="85" y="162" text-anchor="middle" font-size="19" font-weight="600">安装技能</text><text x="85" y="194" text-anchor="middle" font-size="12">检查环境 · 独立工作区</text></g><g transform="translate(215,0)"><circle cx="85" cy="95" r="29" fill="#ffe033"/><text x="85" y="102" text-anchor="middle" fill="#20222a" font-size="19">02</text><text x="85" y="162" text-anchor="middle" font-size="19" font-weight="600">核对身份</text><text x="85" y="194" text-anchor="middle" font-size="12">酒店 · 商家 · 销售主体</text></g><g transform="translate(415,0)"><circle cx="85" cy="95" r="29" fill="#ffe033"/><text x="85" y="102" text-anchor="middle" fill="#20222a" font-size="19">03</text><text x="85" y="162" text-anchor="middle" font-size="19" font-weight="600">读取数据</text><text x="85" y="194" text-anchor="middle" font-size="12">实际后台或用户导出</text></g><g transform="translate(615,0)"><circle cx="85" cy="95" r="29" fill="#ffe033"/><text x="85" y="102" text-anchor="middle" fill="#20222a" font-size="19">04</text><text x="85" y="162" text-anchor="middle" font-size="19" font-weight="600">体检与提案</text><text x="85" y="194" text-anchor="middle" font-size="12">问题证据 · 优先动作</text></g><g transform="translate(815,0)"><circle cx="85" cy="95" r="29" fill="#ffe033"/><text x="85" y="102" text-anchor="middle" font-size="19">05</text><text x="85" y="162" text-anchor="middle" font-size="19" font-weight="600">执行与回读</text><text x="85" y="194" text-anchor="middle" font-size="12">有效授权 · 同一对象</text></g><g transform="translate(1015,0)"><circle cx="85" cy="95" r="29" fill="#ffe033"/><text x="85" y="102" text-anchor="middle" font-size="19">06</text><text x="85" y="162" text-anchor="middle" font-size="19" font-weight="600">持续复盘</text><text x="85" y="194" text-anchor="middle" font-size="12">7 / 14 / 28天观察</text></g><text x="600" y="255" text-anchor="middle" font-size="12" fill="#65616a">登录复用不等于永久在线；报告生成不触发业务写入；真实执行按账号权限适配。</text></g></svg>
